name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: 语法与文档
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 检出源码
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: 敏感信息扫描（工作树 + 已跟踪）
        # 放在所有构建步骤之前：历史事故里构建/测试全绿，最后一步才因本机路径失败。
        run: |
          python3 tools/check-secrets.py
          python3 tools/check-secrets.py --tracked-only

      - name: 装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Go 格式
        # 失败时列出具体文件，避免只看到 exit 1 还得本地复现排查。
        run: |
          unformatted=$(gofmt -l gateways/zgate)
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件未过 gofmt（先 gofmt -w 再提交）："
            echo "$unformatted"
            exit 1
          fi

      - name: Go 构建与测试
        working-directory: gateways/zgate
        run: go build ./... && go test ./...

      - name: zgate 无窗产物校验（PE Subsystem 必须为 GUI）
        # 交叉编译一份 windows/amd64 出来，校验 PE 头的 Subsystem = 2（WINDOWS_GUI）。
        # 忘了 -H windowsgui 会退回 CONSOLE(3)，开机自启就弹 cmd 窗口。机制见 docs/PITFALLS.md §20。
        run: python3 gateways/zgate/build.py --cross-check

      - name: Python 语法
        run: python3 -c "import ast,glob; [ast.parse(open(f,encoding='utf-8').read(), f) for f in glob.glob('**/*.py', recursive=True)]"

      - name: Python 单元测试
        # 价格派生、地区受限换机场等回归守卫；用例全离线，不联网、不碰 provider_config。
        run: python3 -m unittest discover -s tests -v

      - name: JavaScript 语法
        run: find . -name '*.js' -not -path './third-party/*' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check

      - name: 文档自检
        run: python3 tools/check-docs.py

      - name: 项目语义与脚本换行（真值：gateways/zgate/zgate.json）
        # check-docs 只查链接/锚点/引言/孤儿；这一道比对门面口径与 zgate.json，
        # 并校验 tools/zgate-lifecycle 脚本的 LF/BOM。PS1 语法在本机 pre-commit 跑，
        # ubuntu 无 powershell 时 check-project.py 自动 SKIP。
        run: python3 tools/check-project.py
